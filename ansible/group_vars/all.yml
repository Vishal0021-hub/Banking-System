# ==============================================================================
#  BankOps — Shared Global Variables (Non-Sensitive)
# ==============================================================================

app_name: "banking-system"
app_dir: "/opt/banking"
app_user: "bankingapp"
app_group: "banking"

# System packages required
system_packages:
  - curl
  - wget
  - git
  - jq
  - ca-certificates
  - gnupg
  - lsb-release
  - ufw
  - htop
  - net-tools
  - python3-pip

# Spring Boot & Docker Configuration
spring_profile: "docker"
docker_compose_version: "v2.27.0"

# Core service ports
ports:
  frontend: 80
  gateway: 8088
  eureka: 8761
  auth: 8081
  user: 8082
  account: 8083
  transaction: 8084
  notification: 8085
  loan: 8086
  admin: 8087
  mysql: 3306
  redis: 6379
  kafka: 9092

# Health check endpoints for verification phase
health_endpoints:
  - { name: "Eureka Server", url: "http://localhost:8761/actuator/health", expected_status: 200 }
  - { name: "API Gateway", url: "http://localhost:8088/actuator/health", expected_status: 200 }
  - { name: "Auth Service", url: "http://localhost:8081/actuator/health", expected_status: 200 }
  - { name: "Account Service", url: "http://localhost:8083/actuator/health", expected_status: 200 }
  - { name: "Transaction Service", url: "http://localhost:8084/actuator/health", expected_status: 200 }
  - { name: "Frontend Nginx", url: "http://localhost:80", expected_status: 200 }

# Fallback values if vault is not loaded (development defaults)
db_username: "root"
db_password: "{{ vault_db_password | default('root') }}"
jwt_secret: "{{ vault_jwt_secret | default('bXlTdXBlclNlY3JldEtleUZvckJhbmtpbmdTeXN0ZW0xMjM0NTY3ODk=') }}"
jwt_expiration_ms: 86400000
jwt_refresh_expiration_ms: 604800000
eureka_username: "{{ vault_eureka_username | default('eureka') }}"
eureka_password: "{{ vault_eureka_password | default('eureka123') }}"
mail_host: "smtp.gmail.com"
mail_port: 587
mail_username: "{{ vault_mail_username | default('') }}"
mail_password: "{{ vault_mail_password | default('') }}"
