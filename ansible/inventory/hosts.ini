# ==============================================================================
#  BankOps — Ansible Inventory
#  Replace the placeholder IP with the output from `terraform output app_server_public_ip`
# ==============================================================================

[app_servers]
banking-node-01 ansible_host=YOUR_EC2_PUBLIC_OR_PRIVATE_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/bankops-key.pem

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_connection=ssh
