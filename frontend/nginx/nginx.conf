# =============================================================
#  Nginx config for React SPA (Vite build output)
#  - Serves static files from /usr/share/nginx/html
#  - All routes fall back to index.html (client-side routing)
#  - Proxies /api/v1 calls to api-gateway:8088
# =============================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- React SPA fallback: all unknown routes -> index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Real-Time Server-Sent Events (SSE) stream ---
    location /api/v1/notifications/stream {
        proxy_pass         http://api-gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # --- Proxy API calls to the api-gateway container ---
    # The frontend calls /api/v1/* and nginx forwards them to api-gateway
    location /api/ {
        proxy_pass         http://api-gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy "no-referrer"       always;

    # --- Cache static assets ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
