# ==============================================================================
#  BankOps — Custom Nagios Check Commands
# ==============================================================================

# Command to probe Spring Boot Actuator /actuator/health endpoint
# Expects HTTP 200 and JSON string '"status":"UP"'
# Usage: check_actuator_health!PORT
define command {
    command_name    check_actuator_health
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u /actuator/health -s '"status":"UP"' -t 10
}

# General HTTP endpoint probe
# Usage: check_http_endpoint!PORT!URL
define command {
    command_name    check_http_endpoint
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -t 10
}

# TCP Port Availability (for databases & message brokers)
# Usage: check_tcp_port!PORT
define command {
    command_name    check_tcp_port
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -t 5
}

# Remote Host Vital Resource Probes via NRPE
# Usage: check_nrpe!COMMAND
define command {
    command_name    check_nrpe_remote
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$
}
