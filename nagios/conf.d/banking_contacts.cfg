# ==============================================================================
#  BankOps — Nagios Contacts & Alert Notification Groups
# ==============================================================================

define contact {
    contact_name                    devops-admin
    alias                           BankOps DevOps Lead
    service_notification_period     24x7
    host_notification_period        24x7
    service_notification_options    w,u,c,r,f,s
    host_notification_options       d,u,r,f,s
    service_notification_commands   notify-service-by-email
    host_notification_commands      notify-host-by-email
    email                           devops-admin@bankops.internal
}

define contactgroup {
    contactgroup_name               devops-team
    alias                           BankOps Operations & SRE Team
    members                         devops-admin
}
