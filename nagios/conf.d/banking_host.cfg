# ==============================================================================
#  BankOps — Host Definition for Banking Infrastructure Server
# ==============================================================================

define host {
    use                     linux-server
    host_name               banking-app-server
    alias                   Enterprise Digital Banking Node (Ubuntu 22.04 LTS)
    address                 127.0.0.1
    check_command           check-host-alive
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    notification_options    d,u,r
    contact_groups          devops-team
}
