# ==============================================================================
#  BankOps — Service Monitoring Specifications
# ==============================================================================

# Generic service template for BankOps
define service {
    name                            banking-service-template
    use                             generic-service
    host_name                       banking-app-server
    check_period                    24x7
    max_check_attempts              3
    check_interval                  1       # Check every 60 seconds
    retry_interval                  0.5     # Retry after 30 seconds upon warning/failure
    notification_interval           15      # Re-notify every 15 minutes if unhandled
    notification_period             24x7
    notification_options            w,u,c,r # Alert on Warning, Unknown, Critical, Recovery
    contact_groups                  devops-team
    register                        0       # Template, not a real service
}

# ------------------------------------------------------------------------------
# 1. Backing Infrastructure Checks (TCP Port Reachability)
# ------------------------------------------------------------------------------

define service {
    use                             banking-service-template
    service_description             MySQL Database Port (3307/3306)
    check_command                   check_tcp_port!3307
}

define service {
    use                             banking-service-template
    service_description             Redis Cache Port (6379)
    check_command                   check_tcp_port!6379
}

define service {
    use                             banking-service-template
    service_description             Kafka Event Broker (9092)
    check_command                   check_tcp_port!9092
}

define service {
    use                             banking-service-template
    service_description             Zookeeper Coordination (2181)
    check_command                   check_tcp_port!2181
}

# ------------------------------------------------------------------------------
# 2. Frontend & Edge Gateway Health Checks
# ------------------------------------------------------------------------------

define service {
    use                             banking-service-template
    service_description             React Frontend Web UI (Port 80)
    check_command                   check_http_endpoint!80!/
}

define service {
    use                             banking-service-template
    service_description             API Gateway Actuator (Port 8088)
    check_command                   check_actuator_health!8088
}

