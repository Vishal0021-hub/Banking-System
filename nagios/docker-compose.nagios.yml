# ==============================================================================
#  BankOps — Standalone Nagios Core Monitoring Service
#  Starts Nagios Core 4.4+ with Apache Web Dashboard on Port 8089
#
#  Usage:
#    docker compose -f nagios/docker-compose.nagios.yml up -d
#    Open dashboard: http://localhost:8089
#    Credentials:    nagiosadmin / bankops123
# ==============================================================================

version: "3.8"

services:
  nagios:
    image: jasonrivers/nagios:latest
    container_name: bankops-nagios
    restart: unless-stopped
    ports:
      - "8089:80"
    environment:
      - NAGIOSADMIN_USER=nagiosadmin
      - NAGIOSADMIN_PASS=bankops123
      - NAGIOS_TIMEZONE=Asia/Kolkata
    volumes:
      - ./conf.d:/opt/nagios/etc/conf.d:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
