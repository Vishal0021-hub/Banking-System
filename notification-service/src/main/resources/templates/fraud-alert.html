<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fraud Alert</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="background-color: #fff; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <h2 style="color: #d9534f;">⚠️ Transaction Flagged</h2>
        <p>Dear User,</p>
        <p>Your recent transaction of <strong>₹<span th:text="${amount}"></span></strong> (Ref: <span th:text="${refNumber}"></span>) was flagged for suspicious activity.</p>
        <p>If you did not authorize this transaction, please contact our support immediately.</p>
        <hr>
        <p style="font-size: 12px; color: #777;">Enterprise Bank Security Team</p>
    </div>
</body>
</html>
