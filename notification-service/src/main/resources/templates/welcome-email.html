<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Enterprise Bank</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="background-color: #fff; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <h2 style="color: #5cb85c;">🎉 Welcome to Enterprise Bank!</h2>
        <p>Hi <span th:text="${name}"></span>,</p>
        <p>We are thrilled to have you! Your account has been created successfully.</p>
        <p>To unlock all features, please remember to complete your KYC on your dashboard.</p>
        <hr>
        <p style="font-size: 12px; color: #777;">Enterprise Bank Team</p>
    </div>
</body>
</html>
