# -------------------------------------------------------
#  Spring Boot Docker Profile — used when SPRING_PROFILES_ACTIVE=docker
#  Container hostnames replace localhost for all infra.
# -------------------------------------------------------

# DataSource — connect to MySQL container name
spring.datasource.url=jdbc:mysql://mysql:3306/banking_users?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Eureka — register with Eureka container
eureka.client.service-url.defaultZone=http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:eureka123}@eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
# Extra infra connections
spring.kafka.bootstrap-servers=kafka:29092

